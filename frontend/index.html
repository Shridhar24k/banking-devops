<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Banking App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🏦 RBI BANK </h1>

        <!-- REGISTER -->

        <div id="registerSection" class="card">

            <h2>Create Account</h2>

            <input
                id="registerName"
                type="text"
                placeholder="Full Name"
            >

            <input
                id="registerEmail"
                type="email"
                placeholder="Email"
            >

            <input
                id="registerPassword"
                type="password"
                placeholder="Password"
            >

            <button onclick="register()">
                Register
            </button>

            <p id="registerMessage"></p>

        </div>


        <!-- LOGIN -->

        <div id="loginSection" class="card">

            <h2>Login</h2>

            <input
                id="loginEmail"
                type="email"
                placeholder="Email"
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
            >

            <button onclick="login()">
                Login
            </button>

            <p id="loginMessage"></p>

        </div>


        <!-- DASHBOARD -->

        <div id="dashboard" class="card hidden">

            <h2>Bank Dashboard</h2>

            <button onclick="createBankAccount()">
                Create Bank Account
            </button>

            <button onclick="loadAccounts()">
                Refresh Accounts
            </button>

            <button onclick="logout()">
                Logout
            </button>

            <div id="accounts"></div>


            <h3>Deposit</h3>

            <input
                id="depositAmount"
                type="number"
                placeholder="Amount"
            >

            <button onclick="deposit()">
                Deposit
            </button>


            <h3>Withdraw</h3>

            <input
                id="withdrawAmount"
                type="number"
                placeholder="Amount"
            >

            <button onclick="withdraw()">
                Withdraw
            </button>


            <h3>Transaction History</h3>

            <button onclick="loadTransactions()">
                View Transactions
            </button>

            <div id="transactions"></div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
